[project]
name = "cropadvisor"
version = "1.0.0"
description = "Crop recommendation, weather, disease detection and farmer Q&A web app"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
